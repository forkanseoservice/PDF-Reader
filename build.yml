          package com.jahid.pdfreader;

          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.Outline;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.View;
          import android.view.ViewOutlineProvider;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.TextView;

          final class Ui {
              static final int PINK = 0xFFE91E63, ORANGE = 0xFFFF8A5B, BG = 0xFFF6F7FB, INK = 0xFF1F2340, MUTED = 0xFF8A8FA6;

              static int dp(Context c, int v) {
                  return (int) (v * c.getResources().getDisplayMetrics().density + 0.5f);
              }

              static GradientDrawable shape(Context c, int color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(c, radiusDp));
                  return g;
              }

              static TextView tv(Context c, String t, int size, int color, boolean bold) {
                  TextView v = new TextView(c);
                  v.setText(t);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  if (bold) v.setTypeface(Typeface.DEFAULT_BOLD);
                  return v;
              }

              /** Round profile photo with a coloured ring. Caller sets the size via LayoutParams. */
              static View circlePhoto(Context c, int ringColor, int ringDp) {
                  FrameLayout ring = new FrameLayout(c);
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(ringColor);
                  ring.setBackground(g);
                  int pad = dp(c, ringDp);
                  ring.setPadding(pad, pad, pad, pad);
                  ImageView iv = new ImageView(c);
                  iv.setImageResource(R.drawable.profile);
                  iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  iv.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View v, Outline o) {
                          o.setOval(0, 0, v.getWidth(), v.getHeight());
                      }
                  });
                  iv.setClipToOutline(true);
                  ring.addView(iv, new FrameLayout.LayoutParams(-1, -1));
                  return ring;
              }
          }
