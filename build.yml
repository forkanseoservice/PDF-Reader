              private void removeBook(Book b) {
                  all.remove(b);
                  List<Book> l = byFolder.get(b.folder);
                  if (l != null) {
                      l.remove(b);
                      if (l.isEmpty()) {
                          byFolder.remove(b.folder);
                          folderKeys.remove(b.folder);
                          if (b.folder.equals(currentFolder)) currentFolder = null;
                      }
                  }
                  sp.edit().remove("pos:" + b.path).remove("off:" + b.path)
                          .remove("tot:" + b.path).remove("time:" + b.path).apply();
                  refresh();
              }

              // ------------------------------------------------------------------ tools
              private void onTool(int id) {
                  switch (id) {
                      case Screens.T_IMG:
                          pick("image/*", true, RQ_IMG);
                          break;
                      case Screens.T_WORD:
                          pick("*/*", false, RQ_WORD);
                          break;
                      case Screens.T_READWORD:
                          pick("*/*", false, RQ_READ);
                          break;
                      case Screens.T_TEXT:
                          textDialog();
                          break;
                      case Screens.T_NOTES:
                          startActivity(new Intent(this, NotesActivity.class));
                          break;
                      default:
                          break;
                  }
              }

              private void pick(String type, boolean multi, int rq) {
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType(type);
                  if (multi) i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  try {
                      startActivityForResult(Intent.createChooser(i, multi ? "Select images" : "Select a .docx file"), rq);
                  } catch (Exception e) {
                      Toast.makeText(this, "No file picker found", Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onActivityResult(int rq, int res, Intent data) {
                  super.onActivityResult(rq, res, data);
                  if (res != RESULT_OK || data == null) return;
                  if (!hasAccess()) {
                      Toast.makeText(this, "Please allow file access first (Library tab)", Toast.LENGTH_LONG).show();
                      return;
                  }
                  final String stamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date());
                  if (rq == RQ_IMG) {
                      final List<Uri> uris = new ArrayList<>();
                      ClipData cd = data.getClipData();
                      if (cd != null) {
                          for (int i = 0; i < cd.getItemCount(); i++) uris.add(cd.getItemAt(i).getUri());
                      } else if (data.getData() != null) {
                          uris.add(data.getData());
                      }
                      if (uris.isEmpty()) return;
                      runJob("Creating PDF from " + uris.size() + " image(s)...", () -> {
                          File out = PdfTools.uniqueFile("Images_" + stamp);
                          PdfTools.imagesToPdf(this, uris, out);
                          return out;
                      }, false);
                  } else if (rq == RQ_WORD || rq == RQ_READ) {
                      final Uri u = data.getData();
                      if (u == null) return;
                      String nm = displayName(u);
                      if (nm == null) nm = "Word_" + stamp;
                      int dot = nm.lastIndexOf('.');
                      final String base = dot > 0 ? nm.substring(0, dot) : nm;
                      runJob("Converting Word file...", () -> {
                          List<PdfTools.Para> paras = PdfTools.readDocx(this, u);
                          File out = PdfTools.uniqueFile(base);
                          PdfTools.parasToPdf(paras, out);
                          return out;
                      }, rq == RQ_READ);
                  }
              }

              private String displayName(Uri u) {
                  String name = null;
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(u, null, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (i >= 0) name = c.getString(i);
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (c != null) c.close();
                  }
                  return name;
              }

              private void textDialog() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(20), dp(10), dp(20), 0);
                  final EditText name = new EditText(this);
                  name.setHint("File name (optional)");
                  name.setSingleLine(true);
                  box.addView(name);
                  final EditText text = new EditText(this);
                  text.setHint("Type or paste your text here...");
                  text.setMinLines(8);
                  text.setGravity(Gravity.TOP | Gravity.START);
                  box.addView(text);
                  new AlertDialog.Builder(this)
                          .setTitle("Text to PDF")
                          .setView(box)
                          .setPositiveButton("Create PDF", (d, w) -> {
                              final String body = text.getText().toString();
                              final String nm = name.getText().toString().trim();
                              if (body.trim().isEmpty()) {
                                  Toast.makeText(this, "Please type some text", Toast.LENGTH_SHORT).show();
                                  return;
                              }
                              if (!hasAccess()) {
                                  Toast.makeText(this, "Please allow file access first (Library tab)", Toast.LENGTH_LONG).show();
                                  return;
                              }
                              final String stamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date());
                              runJob("Creating PDF...", () -> {
                                  List<PdfTools.Para> paras = new ArrayList<>();
                                  if (!nm.isEmpty()) paras.add(new PdfTools.Para(nm, true));
                                  for (String line : body.split("\n", -1)) paras.add(new PdfTools.Para(line, false));
                                  File out = PdfTools.uniqueFile(nm.isEmpty() ? "Text_" + stamp : nm);
                                  PdfTools.parasToPdf(paras, out);
                                  return out;
                              }, false);
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              private void runJob(String msg, final Job job, final boolean openAfter) {
                  final AlertDialog dlg = new AlertDialog.Builder(this).setMessage(msg).setCancelable(false).create();
                  dlg.show();
                  new Thread(() -> {
                      File out = null;
                      Exception err = null;
                      try {
                          out = job.run();
                      } catch (Exception e) {
                          err = e;
                      }
                      final File fo = out;
                      final Exception fe = err;
                      runOnUiThread(() -> {
                          try { dlg.dismiss(); } catch (Exception ignored) { }
                          if (fe != null || fo == null) {
                              Toast.makeText(this, "Failed: " + (fe == null ? "unknown error" : fe.getMessage()), Toast.LENGTH_LONG).show();
                              return;
                          }
                          if (hasAccess()) scan();
                          if (openAfter) openPdf(fo);
                          else showDone(fo);
                      });
                  }).start();
              }

              private void showDone(final File f) {
                  new AlertDialog.Builder(this)
                          .setTitle("PDF saved \u2714")
                          .setMessage(f.getName() + "\n\nFolder: Documents/FM PDF Reader")
                          .setPositiveButton("Open", (d, w) -> openPdf(f))
                          .setNegativeButton("OK", null)
                          .show();
              }

              private void openPdf(File f) {
                  Intent i = new Intent(this, ReaderActivity.class);
                  i.putExtra("path", f.getAbsolutePath());
                  String n = f.getName();
                  i.putExtra("title", n.toLowerCase(Locale.ROOT).endsWith(".pdf") ? n.substring(0, n.length() - 4) : n);
                  startActivity(i);
              }

              // ------------------------------------------------------------------ thumbnails
              private void loadThumb(final Book b, final ImageView iv) {
                  final String key = b.path + "|" + b.mod + "|" + b.size;
                  iv.setTag(key);
                  Bitmap m = mem.get(key);
                  if (m != null) {
                      iv.setImageBitmap(m);
                      return;
                  }
                  try {
                      pool.submit(() -> {
                          if (!key.equals(iv.getTag())) return;
                          Bitmap bmp = null;
                          try {
                              File dir = new File(getCacheDir(), "thumbs");
                              dir.mkdirs();
                              File cf = new File(dir, Integer.toHexString(key.hashCode()) + ".jpg");
                              if (cf.exists()) bmp = BitmapFactory.decodeFile(cf.getAbsolutePath());
                              if (bmp == null) {
                                  bmp = renderFirstPage(b.file, 360);
                                  if (bmp != null) {
                                      FileOutputStream fo = new FileOutputStream(cf);
                                      bmp.compress(Bitmap.CompressFormat.JPEG, 85, fo);
                                      fo.close();
                                  }
                              }
                          } catch (Throwable t) {
                              bmp = null;
                          }
                          if (bmp == null) return;
                          mem.put(key, bmp);
                          final Bitmap fb = bmp;
                          runOnUiThread(() -> {
                              if (key.equals(iv.getTag())) iv.setImageBitmap(fb);
                          });
                      });
                  } catch (Exception ignored) { }
              }

              private Bitmap renderFirstPage(File f, int w) {
                  ParcelFileDescriptor pfd = null;
                  PdfRenderer r = null;
                  PdfRenderer.Page p = null;
                  try {
                      pfd = ParcelFileDescriptor.open(f, ParcelFileDescriptor.MODE_READ_ONLY);
                      r = new PdfRenderer(pfd);
                      p = r.openPage(0);
                      int h = (int) (w * (float) p.getHeight() / p.getWidth());
                      Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                      bmp.eraseColor(Color.WHITE);
                      p.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                      return bmp;
                  } catch (Throwable t) {
                      return null;
                  } finally {
                      try { if (p != null) p.close(); } catch (Throwable ignored) { }
                      try { if (r != null) r.close(); } catch (Throwable ignored) { }
                      try { if (pfd != null) pfd.close(); } catch (Throwable ignored) { }
                  }
              }

