                  toolsPane.setVisibility(p == 1 ? View.VISIBLE : View.GONE);
                  aboutPane.setVisibility(p == 2 ? View.VISIBLE : View.GONE);
                  btnSearch.setVisibility(p == 0 ? View.VISIBLE : View.GONE);
                  btnRescan.setVisibility(p == 0 ? View.VISIBLE : View.GONE);
