          package com.jahid.pdfreader;

          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONObject;

          final class Notes {
              private static final String KEY = "notes_json";

              static JSONArray all(SharedPreferences sp) {
                  try {
                      return new JSONArray(sp.getString(KEY, "[]"));
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              static void add(SharedPreferences sp, String path, String title, int page, String text) {
                  try {
                      JSONArray a = all(sp);
                      JSONObject o = new JSONObject();
                      o.put("id", System.currentTimeMillis());
                      o.put("path", path);
                      o.put("title", title);
                      o.put("page", page);
                      o.put("text", text);
                      a.put(o);
                      sp.edit().putString(KEY, a.toString()).apply();
                  } catch (Exception ignored) { }
              }

              static void delete(SharedPreferences sp, long id) {
                  try {
                      JSONArray a = all(sp);
                      JSONArray n = new JSONArray();
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.getJSONObject(i);
                          if (o.optLong("id") != id) n.put(o);
                      }
                      sp.edit().putString(KEY, n.toString()).apply();
                  } catch (Exception ignored) { }
              }
          }
