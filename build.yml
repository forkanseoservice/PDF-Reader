          public class NotesActivity extends Activity {
              private SharedPreferences sp;
              private final List<JSONObject> items = new ArrayList<>();
              private ListView list;
              private TextView empty;
              private NoteAdapter adapter;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Ui.ORANGE);
                  sp = getSharedPreferences("reading", MODE_PRIVATE);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Ui.BG);

                  TextView bar = Ui.tv(this, "\u2039   My Notes", 20, Color.WHITE, true);
                  bar.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{Ui.ORANGE, Ui.PINK}));
                  bar.setPadding(Ui.dp(this, 18), Ui.dp(this, 18), Ui.dp(this, 18), Ui.dp(this, 18));
                  bar.setOnClickListener(v -> finish());
                  root.addView(bar);

                  FrameLayout body = new FrameLayout(this);
                  list = new ListView(this);
                  list.setDivider(null);
                  list.setSelector(new ColorDrawable(Color.TRANSPARENT));
                  list.setPadding(0, Ui.dp(this, 8), 0, Ui.dp(this, 20));
                  list.setClipToPadding(false);
                  adapter = new NoteAdapter();
                  list.setAdapter(adapter);
                  body.addView(list, new FrameLayout.LayoutParams(-1, -1));
                  empty = Ui.tv(this, "No notes yet.\nOpen a PDF and tap \u270E Note to save a note for a page.", 15, Ui.MUTED, false);
                  empty.setGravity(Gravity.CENTER);
                  empty.setPadding(Ui.dp(this, 30), Ui.dp(this, 30), Ui.dp(this, 30), Ui.dp(this, 30));
                  body.addView(empty, new FrameLayout.LayoutParams(-1, -1));
                  root.addView(body, new LinearLayout.LayoutParams(-1, 0, 1));
                  setContentView(root);

                  list.setOnItemClickListener((p, v, pos, id) -> {
                      JSONObject o = items.get(pos);
                      String path = o.optString("path");
                      if (!new File(path).exists()) {
                          Toast.makeText(this, "This PDF no longer exists", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      Intent i = new Intent(this, ReaderActivity.class);
                      i.putExtra("path", path);
                      i.putExtra("title", o.optString("title"));
                      i.putExtra("page", Math.max(0, o.optInt("page", 1) - 1));
                      startActivity(i);
                  });
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  load();
              }

              private void load() {
                  items.clear();
                  JSONArray a = Notes.all(sp);
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject o = a.optJSONObject(i);
                      if (o != null) items.add(o);
                  }
                  Collections.sort(items, (x, y) -> Long.compare(y.optLong("id"), x.optLong("id")));
                  empty.setVisibility(items.isEmpty() ? View.VISIBLE : View.GONE);
                  adapter.notifyDataSetChanged();
              }

              private class NoteAdapter extends BaseAdapter {
                  public int getCount() { return items.size(); }
                  public Object getItem(int i) { return items.get(i); }
                  public long getItemId(int i) { return i; }

                  public View getView(int pos, View cv, ViewGroup parent) {
                      final JSONObject o = items.get(pos);
                      LinearLayout outer = new LinearLayout(NotesActivity.this);
                      outer.setPadding(Ui.dp(NotesActivity.this, 14), Ui.dp(NotesActivity.this, 6),
                              Ui.dp(NotesActivity.this, 14), Ui.dp(NotesActivity.this, 6));
                      LinearLayout card = new LinearLayout(NotesActivity.this);
                      card.setOrientation(LinearLayout.HORIZONTAL);
                      card.setPadding(Ui.dp(NotesActivity.this, 14), Ui.dp(NotesActivity.this, 12),
                              Ui.dp(NotesActivity.this, 10), Ui.dp(NotesActivity.this, 12));
                      card.setBackground(Ui.shape(NotesActivity.this, Color.WHITE, 16));
                      card.setElevation(Ui.dp(NotesActivity.this, 2));

                      LinearLayout col = new LinearLayout(NotesActivity.this);
                      col.setOrientation(LinearLayout.VERTICAL);
                      TextView book = Ui.tv(NotesActivity.this, o.optString("title") + "  \u2022  Page " + o.optInt("page"), 12, Ui.PINK, true);
                      book.setSingleLine(true);
                      col.addView(book);
                      TextView text = Ui.tv(NotesActivity.this, o.optString("text"), 15, Ui.INK, false);
                      text.setPadding(0, Ui.dp(NotesActivity.this, 4), 0, Ui.dp(NotesActivity.this, 4));
                      col.addView(text);
                      String date = new SimpleDateFormat("dd MMM yyyy, hh:mm a", Locale.getDefault()).format(new Date(o.optLong("id")));
                      col.addView(Ui.tv(NotesActivity.this, date, 11, Ui.MUTED, false));
                      card.addView(col, new LinearLayout.LayoutParams(0, -2, 1));

                      TextView del = Ui.tv(NotesActivity.this, "\uD83D\uDDD1", 20, Ui.MUTED, false);
                      del.setPadding(Ui.dp(NotesActivity.this, 10), Ui.dp(NotesActivity.this, 4), Ui.dp(NotesActivity.this, 6), Ui.dp(NotesActivity.this, 4));
                      del.setOnClickListener(v -> new AlertDialog.Builder(NotesActivity.this)
                              .setMessage("Delete this note?")
                              .setPositiveButton("Delete", (d, w) -> {
                                  Notes.delete(sp, o.optLong("id"));
                                  load();
                              })
                              .setNegativeButton("Cancel", null)
                              .show());
                      card.addView(del);
                      outer.addView(card, new LinearLayout.LayoutParams(-1, -2));
                      return outer;
                  }
              }
          }
