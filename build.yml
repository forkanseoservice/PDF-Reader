          package com.jahid.pdfreader;

          import android.content.Context;
          import android.view.GestureDetector;
          import android.view.MotionEvent;
          import android.view.ScaleGestureDetector;
          import android.view.View;
          import android.view.ViewConfiguration;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;

          /** Pinch-to-zoom, double-tap zoom and horizontal pan around a vertically scrolling child. */
          public class ZoomFrame extends FrameLayout {
              public Runnable onTap;
              private final View child;
              private float scale = 1f, tx = 0f, lastX, lastY;
              private final ScaleGestureDetector sd;
              private final GestureDetector gd;
              private final int slop;

              public ZoomFrame(Context c, View child) {
                  super(c);
                  this.child = child;
                  addView(child, new FrameLayout.LayoutParams(-1, -1));
                  child.setPivotX(0f);
                  child.setPivotY(0f);
                  slop = ViewConfiguration.get(c).getScaledTouchSlop();
                  sd = new ScaleGestureDetector(c, new ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      @Override
                      public boolean onScale(ScaleGestureDetector d) {
                          zoomTo(scale * d.getScaleFactor(), d.getFocusX());
                          return true;
                      }
                  });
                  gd = new GestureDetector(c, new GestureDetector.SimpleOnGestureListener() {
                      @Override
                      public boolean onDoubleTap(MotionEvent e) {
                          zoomTo(scale > 1.05f ? 1f : 2.2f, e.getX());
                          return true;
                      }

                      @Override
                      public boolean onSingleTapConfirmed(MotionEvent e) {
                          if (onTap != null) onTap.run();
                          return true;
                      }
                  });
              }

              private void zoomTo(float ns, float fx) {
                  ns = Math.max(1f, Math.min(4f, ns));
                  float r = ns / scale;
                  tx = fx - (fx - tx) * r;
                  scale = ns;
                  apply();
              }

              private void apply() {
                  float w = getWidth(), h = getHeight();
                  tx = Math.min(0f, Math.max(tx, w - w * scale));
                  child.setScaleX(scale);
                  child.setScaleY(scale);
                  child.setTranslationX(tx);
                  ViewGroup.LayoutParams lp = child.getLayoutParams();
                  int nh = (int) (h / scale);
                  if (h > 0 && lp.height != nh) {
                      lp.height = nh;
                      child.setLayoutParams(lp);
                  }
              }

              @Override
              protected void onSizeChanged(int w, int h, int ow, int oh) {
                  super.onSizeChanged(w, h, ow, oh);
                  apply();
              }

              @Override
              public boolean dispatchTouchEvent(MotionEvent ev) {
                  sd.onTouchEvent(ev);
                  gd.onTouchEvent(ev);
                  return super.dispatchTouchEvent(ev);
              }

              @Override
              public boolean onInterceptTouchEvent(MotionEvent ev) {
                  switch (ev.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          lastX = ev.getX();
                          lastY = ev.getY();
                          break;
                      case MotionEvent.ACTION_MOVE:
                          if (sd.isInProgress()) return true;
                          if (scale > 1.01f && ev.getPointerCount() == 1) {
                              float dx = ev.getX() - lastX, dy = ev.getY() - lastY;
                              if (Math.abs(dx) > slop && Math.abs(dx) > Math.abs(dy)) {
                                  lastX = ev.getX();
                                  return true;
                              }
                          }
                          break;
                      default:
                          break;
                  }
                  return false;
              }

              @Override
              public boolean onTouchEvent(MotionEvent ev) {
                  switch (ev.getActionMasked()) {
                      case MotionEvent.ACTION_MOVE:
                          if (ev.getPointerCount() == 1 && !sd.isInProgress()) {
                              float x = ev.getX();
                              tx += x - lastX;
                              lastX = x;
                              apply();
                          }
                          break;
                      case MotionEvent.ACTION_POINTER_UP:
                          lastX = ev.getX(ev.getActionIndex() == 0 ? 1 : 0);
                          break;
                      case MotionEvent.ACTION_DOWN:
                          lastX = ev.getX();
                          break;
                      default:
                          break;
                  }
                  return true;
              }
          }
