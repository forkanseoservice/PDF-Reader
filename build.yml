          mkdir -p app/src/main/java/com/jahid/pdfreader
          cat > app/src/main/java/com/jahid/pdfreader/ReaderActivity.java <<'EOF_FILE'
          package com.jahid.pdfreader;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.SharedPreferences;
          import android.content.res.ColorStateList;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.pdf.PdfRenderer;
          import android.os.Bundle;
          import android.os.ParcelFileDescriptor;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.AbsListView;
          import android.widget.BaseAdapter;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class ReaderActivity extends Activity {
              private static final int PINK = 0xFFE91E63, INK = 0xFF1F2340;

              private String path, title;
              private SharedPreferences sp;
              private ParcelFileDescriptor pfd;
              private PdfRenderer renderer;
              private final Object lock = new Object();
              private boolean closed = false;
              private final ExecutorService exec = Executors.newSingleThreadExecutor();
              private int pageCount, width, itemH;
              private ListView listView;
              private TextView indicator, topBar;
              private SeekBar seek;
              private LinearLayout panel;

              private int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density + 0.5f); }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().setStatusBarColor(INK);
                  path = getIntent().getStringExtra("path");
                  title = getIntent().getStringExtra("title");
                  if (title == null) title = new File(path).getName();
                  sp = getSharedPreferences("reading", MODE_PRIVATE);
                  try {
                      pfd = ParcelFileDescriptor.open(new File(path), ParcelFileDescriptor.MODE_READ_ONLY);
                      renderer = new PdfRenderer(pfd);
                      pageCount = renderer.getPageCount();
                      PdfRenderer.Page p = renderer.openPage(0);
                      float pw = p.getWidth(), ph = p.getHeight();
                      p.close();
                      width = getResources().getDisplayMetrics().widthPixels;
                      itemH = (int) (width * ph / pw);
                  } catch (Exception e) {
                      Toast.makeText(this, "Cannot open this PDF (protected or damaged)", Toast.LENGTH_LONG).show();
                      finish();
                      return;
                  }

                  final FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF2B2D3A);
                  listView = new ListView(this);
                  listView.setDivider(new ColorDrawable(0xFF2B2D3A));
                  listView.setDividerHeight(dp(6));
                  listView.setFastScrollEnabled(true);
                  listView.setSelector(new ColorDrawable(Color.TRANSPARENT));
                  listView.setAdapter(new PageAdapter());
                  root.addView(listView, new FrameLayout.LayoutParams(-1, -1));

                  topBar = new TextView(this);
                  topBar.setText("\u2039   " + title);
                  topBar.setTextColor(Color.WHITE);
                  topBar.setTextSize(16);
                  topBar.setSingleLine(true);
                  topBar.setEllipsize(android.text.TextUtils.TruncateAt.END);
                  topBar.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
                  topBar.setBackgroundColor(0xEE1F2340);
                  topBar.setPadding(dp(16), dp(14), dp(16), dp(14));
                  topBar.setOnClickListener(v -> finish());
                  root.addView(topBar, new FrameLayout.LayoutParams(-1, -2, Gravity.TOP));

                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable pbg = new GradientDrawable();
                  pbg.setColor(0xEE1F2340);
                  pbg.setCornerRadius(dp(18));
                  panel.setBackground(pbg);
                  panel.setPadding(dp(16), dp(10), dp(16), dp(8));
                  indicator = new TextView(this);
                  indicator.setTextColor(Color.WHITE);
                  indicator.setTextSize(13);
                  indicator.setGravity(Gravity.CENTER);
                  indicator.setOnClickListener(v -> askPage());
                  panel.addView(indicator, new LinearLayout.LayoutParams(-1, -2));
                  seek = new SeekBar(this);
                  seek.setMax(Math.max(1, pageCount - 1));
                  seek.setProgressTintList(ColorStateList.valueOf(PINK));
                  seek.setThumbTintList(ColorStateList.valueOf(PINK));
                  panel.addView(seek, new LinearLayout.LayoutParams(-1, -2));
                  FrameLayout.LayoutParams plp = new FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM);
                  plp.setMargins(dp(16), 0, dp(16), dp(18));
                  root.addView(panel, plp);
                  setContentView(root);

                  int saved = Math.max(0, Math.min(sp.getInt("pos:" + path, 0), pageCount - 1));
                  int off = sp.getInt("off:" + path, 0);
                  listView.setSelectionFromTop(saved, off);
                  seek.setProgress(saved);
                  updateIndicator(saved);

                  seek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      public void onProgressChanged(SeekBar sb, int progress, boolean fromUser) {
                          if (fromUser) {
                              listView.setSelection(progress);
                              updateIndicator(progress);
                          }
                      }
                      public void onStartTrackingTouch(SeekBar sb) { }
                      public void onStopTrackingTouch(SeekBar sb) { }
                  });
                  listView.setOnScrollListener(new AbsListView.OnScrollListener() {
                      public void onScrollStateChanged(AbsListView v, int s) { }
                      public void onScroll(AbsListView v, int first, int vis, int total) {
                          updateIndicator(first);
                          seek.setProgress(first);
                      }
                  });
                  listView.setOnItemClickListener((p, v, pos, id) -> {
                      int vis = panel.getVisibility() == View.VISIBLE ? View.GONE : View.VISIBLE;
                      panel.setVisibility(vis);
                      topBar.setVisibility(vis);
                  });
                  root.postDelayed(() -> {
                      if (panel != null) {
                          panel.setVisibility(View.GONE);
                          topBar.setVisibility(View.GONE);
                      }
                  }, 2500);
              }

              private void updateIndicator(int pos) {
                  indicator.setText("Page " + (pos + 1) + " / " + pageCount + "   \u2022   tap to jump");
              }

              private void askPage() {
                  final EditText et = new EditText(this);
                  et.setInputType(InputType.TYPE_CLASS_NUMBER);
                  et.setHint("1 - " + pageCount);
                  new AlertDialog.Builder(this)
                          .setTitle("Go to page")
                          .setView(et)
                          .setPositiveButton("Go", (d, w) -> {
                              try {
                                  int n = Integer.parseInt(et.getText().toString().trim());
                                  n = Math.max(1, Math.min(pageCount, n));
                                  listView.setSelection(n - 1);
                                  seek.setProgress(n - 1);
                              } catch (Exception ignored) { }
                          })
                          .setNegativeButton("Cancel", null)
                          .show();
              }

              private void savePosition() {
                  if (listView == null || pageCount == 0) return;
                  int pos = listView.getFirstVisiblePosition();
                  View c = listView.getChildAt(0);
                  int off = c == null ? 0 : c.getTop();
                  sp.edit().putInt("pos:" + path, pos)
                          .putInt("off:" + path, off)
                          .putInt("tot:" + path, pageCount)
                          .putLong("time:" + path, System.currentTimeMillis())
                          .apply();
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  savePosition();
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  exec.shutdownNow();
                  synchronized (lock) {
                      closed = true;
                      try { if (renderer != null) renderer.close(); } catch (Exception ignored) { }
                      try { if (pfd != null) pfd.close(); } catch (Exception ignored) { }
                  }
              }

              private class PageAdapter extends BaseAdapter {
                  public int getCount() { return pageCount; }
                  public Object getItem(int i) { return i; }
                  public long getItemId(int i) { return i; }

                  public View getView(final int position, View cv, ViewGroup parent) {
                      final ImageView iv;
                      if (cv instanceof ImageView) {
                          iv = (ImageView) cv;
                      } else {
                          iv = new ImageView(ReaderActivity.this);
                          iv.setScaleType(ImageView.ScaleType.FIT_XY);
                          iv.setLayoutParams(new AbsListView.LayoutParams(width, itemH));
                      }
                      iv.setBackgroundColor(Color.WHITE);
                      iv.setImageBitmap(null);
                      iv.setTag(position);
                      try {
                          exec.submit(() -> {
                              Object t = iv.getTag();
                              if (!(t instanceof Integer) || (Integer) t != position) return;
                              Bitmap bmp = null;
                              synchronized (lock) {
                                  if (closed) return;
                                  PdfRenderer.Page p = null;
                                  try {
                                      p = renderer.openPage(position);
                                      bmp = Bitmap.createBitmap(width, itemH, Bitmap.Config.ARGB_8888);
                                      bmp.eraseColor(Color.WHITE);
                                      p.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                                  } catch (Exception e) {
                                      bmp = null;
                                  } finally {
                                      if (p != null) p.close();
                                  }
                              }
                              final Bitmap out = bmp;
                              if (out == null) return;
                              runOnUiThread(() -> {
                                  Object t2 = iv.getTag();
                                  if (t2 instanceof Integer && (Integer) t2 == position) iv.setImageBitmap(out);
                              });
                          });
                      } catch (Exception ignored) { }
                      return iv;
                  }
              }
          }
          EOF_FILE
