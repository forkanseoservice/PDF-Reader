name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PdfReader"
          include ':app'
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.jahid.pdfreader'
              compileSdk 34
              defaultConfig {
                  applicationId "com.jahid.pdfreader"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <application
                  android:icon="@drawable/ic_launcher"
                  android:label="PDF Reader"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".ReaderActivity" android:exported="false" />
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#E91E63" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M34,24h28l16,16v44a4,4 0 0,1 -4,4H34a4,4 0 0,1 -4,-4V28a4,4 0 0,1 4,-4z" />
              <path android:fillColor="#FFC1D6" android:pathData="M62,24v16h16z" />
              <path android:fillColor="#E91E63" android:pathData="M40,56h28v4h-28z M40,66h28v4h-28z M40,76h18v4h-18z" />
          </vector>
          EOF_FILE
          mkdir -p app/src/main/java/com/jahid/pdfreader
          cat > app/src/main/java/com/jahid/pdfreader/MainActivity.java <<'EOF_FILE'
          package com.jahid.pdfreader;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.Outline;
          import android.graphics.Typeface;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.pdf.PdfRenderer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.ParcelFileDescriptor;
          import android.provider.Settings;
          import android.text.Editable;
          import android.text.TextUtils;
          import android.text.TextWatcher;
          import android.util.LruCache;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewOutlineProvider;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.BaseAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.GridView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.TreeMap;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {
              static final int PINK = 0xFFE91E63, ORANGE = 0xFFFF8A5B, BG = 0xFFF6F7FB, INK = 0xFF1F2340, MUTED = 0xFF8A8FA6;
              static final int[] PALETTE = {0xFF6C63FF, 0xFFFF6B6B, 0xFF20B2AA, 0xFFFFA726, 0xFF42A5F5, 0xFFAB47BC, 0xFF26A69A, 0xFFEF5350};

              static class Book {
                  File file;
                  String path, title, folder;
                  long mod, size;
              }

              private SharedPreferences sp;
              private final List<Book> all = new ArrayList<>();
              private final Map<String, List<Book>> byFolder = new TreeMap<>();
              private final List<String> folderKeys = new ArrayList<>();
              private final List<String> folderShown = new ArrayList<>();
              private final List<Book> shown = new ArrayList<>();
              private int tab = 0, sortMode = 0, colW;
              private String currentFolder = null, query = "";
              private boolean loaded = false, scanning = false;

              private TextView status, sortChip, backBar, empty;
              private final TextView[] tabViews = new TextView[3];
              private EditText search;
              private FrameLayout heroHolder;
              private GridView grid;
              private ListView folderList;
              private LinearLayout permBox;
              private BookAdapter bookAdapter;
              private FolderAdapter folderAdapter;

              private final ExecutorService pool = Executors.newFixedThreadPool(2);
              private LruCache<String, Bitmap> mem;

              private int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density + 0.5f); }

              private GradientDrawable shape(int color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              private TextView tv(String t, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(t);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  if (bold) v.setTypeface(Typeface.DEFAULT_BOLD);
                  return v;
              }

              private TextView iconBtn(String t) {
                  TextView v = tv(t, 18, Color.WHITE, true);
                  v.setGravity(Gravity.CENTER);
                  v.setBackground(shape(0x33FFFFFF, 22));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(44), dp(44));
                  lp.leftMargin = dp(8);
                  v.setLayoutParams(lp);
                  return v;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("reading", MODE_PRIVATE);
                  getWindow().setStatusBarColor(ORANGE);
                  int maxKb = (int) (Runtime.getRuntime().maxMemory() / 1024 / 8);
                  mem = new LruCache<String, Bitmap>(maxKb) {
                      @Override
                      protected int sizeOf(String k, Bitmap v) { return v.getByteCount() / 1024; }
                  };
                  int screenW = getResources().getDisplayMetrics().widthPixels;
                  colW = (screenW - dp(16) - 2 * dp(10)) / 3;

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  // ---------- header ----------
                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.VERTICAL);
                  header.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{ORANGE, PINK}));
                  header.setPadding(dp(18), dp(14), dp(12), dp(16));
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  TextView title = tv("My Library", 26, Color.WHITE, true);
                  row.addView(title, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
                  TextView btnSearch = iconBtn("\uD83D\uDD0D");
                  TextView btnRescan = iconBtn("\u21BB");
                  row.addView(btnSearch);
                  row.addView(btnRescan);
                  header.addView(row);

                  search = new EditText(this);
                  search.setHint("Search books...");
                  search.setSingleLine(true);
                  search.setTextSize(15);
                  search.setTextColor(INK);
                  search.setHintTextColor(MUTED);
                  search.setBackground(shape(Color.WHITE, 14));
                  search.setPadding(dp(14), dp(10), dp(14), dp(10));
                  search.setVisibility(View.GONE);
                  LinearLayout.LayoutParams slp = new LinearLayout.LayoutParams(-1, -2);
                  slp.topMargin = dp(12);
                  slp.rightMargin = dp(6);
                  header.addView(search, slp);
                  root.addView(header);

                  search.addTextChangedListener(new TextWatcher() {
                      public void beforeTextChanged(CharSequence s, int a, int c, int d) { }
                      public void onTextChanged(CharSequence s, int a, int c, int d) { }
                      public void afterTextChanged(Editable e) {
                          query = e.toString().trim().toLowerCase(Locale.ROOT);
                          refresh();
                      }
                  });
                  btnSearch.setOnClickListener(v -> {
                      InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                      if (search.getVisibility() == View.VISIBLE) {
                          search.setText("");
                          search.setVisibility(View.GONE);
                          imm.hideSoftInputFromWindow(search.getWindowToken(), 0);
                      } else {
                          search.setVisibility(View.VISIBLE);
                          search.requestFocus();
                          imm.showSoftInput(search, 0);
                      }
                  });
                  btnRescan.setOnClickListener(v -> { if (hasAccess()) scan(); });

                  // ---------- hero ----------
                  heroHolder = new FrameLayout(this);
                  LinearLayout.LayoutParams hlp = new LinearLayout.LayoutParams(-1, -2);
                  hlp.setMargins(dp(14), dp(14), dp(14), dp(2));
                  root.addView(heroHolder, hlp);

                  // ---------- tabs ----------
                  LinearLayout tabs = new LinearLayout(this);
                  tabs.setOrientation(LinearLayout.HORIZONTAL);
                  tabs.setGravity(Gravity.CENTER_VERTICAL);
                  tabs.setPadding(dp(10), dp(10), dp(12), dp(4));
                  String[] names = {"Library", "Folders", "Recent"};
                  for (int i = 0; i < 3; i++) {
                      final int idx = i;
                      TextView t = tv(names[i], 14, MUTED, true);
                      t.setPadding(dp(16), dp(8), dp(16), dp(8));
                      t.setOnClickListener(v -> setTab(idx));
                      tabViews[i] = t;
                      tabs.addView(t);
                  }
                  View spacer = new View(this);
                  tabs.addView(spacer, new LinearLayout.LayoutParams(0, 1, 1));
                  sortChip = tv("Sort: Name \u25BE", 12, INK, false);
                  sortChip.setBackground(shape(0xFFE8EAF3, 16));
                  sortChip.setPadding(dp(12), dp(7), dp(12), dp(7));
                  sortChip.setOnClickListener(v -> { sortMode = (sortMode + 1) % 3; refresh(); });
                  tabs.addView(sortChip);
                  root.addView(tabs);

                  status = tv("", 12, MUTED, false);
                  status.setPadding(dp(18), dp(2), dp(18), dp(4));
                  root.addView(status);

                  backBar = tv("", 15, PINK, true);
                  backBar.setPadding(dp(18), dp(6), dp(18), dp(8));
                  backBar.setVisibility(View.GONE);
                  backBar.setOnClickListener(v -> { currentFolder = null; refresh(); });
                  root.addView(backBar);

                  // ---------- content ----------
                  FrameLayout content = new FrameLayout(this);
                  grid = new GridView(this);
                  grid.setNumColumns(3);
                  grid.setHorizontalSpacing(dp(10));
                  grid.setVerticalSpacing(dp(14));
                  grid.setPadding(dp(8), dp(6), dp(8), dp(20));
                  grid.setClipToPadding(false);
                  grid.setSelector(new ColorDrawable(Color.TRANSPARENT));
                  grid.setStretchMode(GridView.STRETCH_COLUMN_WIDTH);
                  bookAdapter = new BookAdapter();
                  grid.setAdapter(bookAdapter);
                  grid.setOnItemClickListener((p, v, pos, id) -> open(shown.get(pos)));
                  content.addView(grid, new FrameLayout.LayoutParams(-1, -1));

                  folderList = new ListView(this);
                  folderList.setDivider(null);
                  folderList.setPadding(0, dp(4), 0, dp(20));
                  folderList.setClipToPadding(false);
                  folderList.setSelector(new ColorDrawable(Color.TRANSPARENT));
                  folderAdapter = new FolderAdapter();
                  folderList.setAdapter(folderAdapter);
                  folderList.setOnItemClickListener((p, v, pos, id) -> {
                      currentFolder = folderShown.get(pos);
                      refresh();
                  });
                  content.addView(folderList, new FrameLayout.LayoutParams(-1, -1));

                  empty = tv("", 15, MUTED, false);
                  empty.setGravity(Gravity.CENTER);
                  empty.setPadding(dp(30), dp(30), dp(30), dp(30));
                  content.addView(empty, new FrameLayout.LayoutParams(-1, -1));

                  permBox = new LinearLayout(this);
                  permBox.setOrientation(LinearLayout.VERTICAL);
                  permBox.setGravity(Gravity.CENTER);
                  permBox.setPadding(dp(30), dp(30), dp(30), dp(30));
                  TextView pt = tv("Allow file access so the app can find all your PDFs.", 15, INK, false);
                  pt.setGravity(Gravity.CENTER);
                  permBox.addView(pt);
                  Button allow = new Button(this);
                  allow.setText("Allow file access");
                  allow.setAllCaps(false);
                  allow.setTextColor(Color.WHITE);
                  allow.setBackground(shape(PINK, 24));
                  allow.setPadding(dp(24), 0, dp(24), 0);
                  allow.setOnClickListener(v -> askAccess());
                  LinearLayout.LayoutParams alp = new LinearLayout.LayoutParams(-2, dp(48));
                  alp.topMargin = dp(16);
                  permBox.addView(allow, alp);
                  content.addView(permBox, new FrameLayout.LayoutParams(-1, -1));

                  root.addView(content, new LinearLayout.LayoutParams(-1, 0, 1));
                  setContentView(root);

                  if (!hasAccess() && Build.VERSION.SDK_INT < 30) {
                      requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 1);
                  }
                  refresh();
              }

              // ------------------------------------------------------------------ access / scan
              private boolean hasAccess() {
                  if (Build.VERSION.SDK_INT >= 30) return Environment.isExternalStorageManager();
                  return checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED;
              }

              private void askAccess() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                  Uri.parse("package:" + getPackageName())));
                      } catch (Exception e) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
                      }
                  } else {
                      requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE}, 1);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (hasAccess() && !loaded && !scanning) scan();
                  refresh();
              }

              private void scan() {
                  scanning = true;
                  refresh();
                  new Thread(() -> {
                      final List<Book> list = new ArrayList<>();
                      walk(Environment.getExternalStorageDirectory(), list, 0);
                      final Map<String, List<Book>> m = new TreeMap<>();
                      for (Book bk : list) {
                          List<Book> l = m.get(bk.folder);
                          if (l == null) { l = new ArrayList<>(); m.put(bk.folder, l); }
                          l.add(bk);
                      }
                      final List<String> keys = new ArrayList<>(m.keySet());
                      Collections.sort(keys, (a, c) -> new File(a).getName().compareToIgnoreCase(new File(c).getName()));
                      runOnUiThread(() -> {
                          all.clear();
                          all.addAll(list);
                          byFolder.clear();
                          byFolder.putAll(m);
                          folderKeys.clear();
                          folderKeys.addAll(keys);
                          loaded = true;
                          scanning = false;
                          refresh();
                      });
                  }).start();
              }

              private void walk(File dir, List<Book> out, int depth) {
                  if (depth > 15) return;
                  File[] fs = dir.listFiles();
                  if (fs == null) return;
                  for (File f : fs) {
                      String n = f.getName();
                      if (f.isDirectory()) {
                          if (n.startsWith(".")) continue;
                          walk(f, out, depth + 1);
                      } else if (n.toLowerCase(Locale.ROOT).endsWith(".pdf")) {
                          Book bk = new Book();
                          bk.file = f;
                          bk.path = f.getAbsolutePath();
                          bk.folder = dir.getAbsolutePath();
                          bk.title = n.substring(0, n.length() - 4).replace('_', ' ');
                          bk.mod = f.lastModified();
                          bk.size = f.length();
                          out.add(bk);
                      }
                  }
              }

              // ------------------------------------------------------------------ state
              private void setTab(int t) {
                  tab = t;
                  currentFolder = null;
                  refresh();
              }

              private int pct(String path) {
                  int tot = sp.getInt("tot:" + path, 0);
                  if (tot <= 0) return 0;
                  return Math.min(100, (sp.getInt("pos:" + path, 0) + 1) * 100 / tot);
              }

              private String sizeStr(long s) {
                  if (s < 1048576) return String.format(Locale.US, "%d KB", s / 1024);
                  return String.format(Locale.US, "%.1f MB", s / 1048576.0);
              }

              private void open(Book b) {
                  Intent i = new Intent(this, ReaderActivity.class);
                  i.putExtra("path", b.path);
                  i.putExtra("title", b.title);
                  startActivity(i);
              }

              private void refresh() {
                  boolean access = hasAccess();
                  for (int i = 0; i < 3; i++) {
                      tabViews[i].setBackground(shape(i == tab ? PINK : Color.TRANSPARENT, 20));
                      tabViews[i].setTextColor(i == tab ? Color.WHITE : MUTED);
                  }
                  permBox.setVisibility(access ? View.GONE : View.VISIBLE);
                  if (!access) {
                      grid.setVisibility(View.GONE);
                      folderList.setVisibility(View.GONE);
                      empty.setVisibility(View.GONE);
                      heroHolder.setVisibility(View.GONE);
                      backBar.setVisibility(View.GONE);
                      status.setText("");
                      return;
                  }

                  boolean showFolders = tab == 1 && currentFolder == null;
                  shown.clear();
                  folderShown.clear();
                  if (showFolders) {
                      for (String k : folderKeys) {
                          if (query.isEmpty() || new File(k).getName().toLowerCase(Locale.ROOT).contains(query)) folderShown.add(k);
                      }
                  } else {
                      List<Book> src = tab == 1 ? byFolder.get(currentFolder) : all;
                      if (src != null) {
                          for (Book bk : src) {
                              if (tab == 2 && sp.getLong("time:" + bk.path, 0) == 0) continue;
                              if (!query.isEmpty() && !bk.title.toLowerCase(Locale.ROOT).contains(query)) continue;
                              shown.add(bk);
                          }
                      }
                      Comparator<Book> cmp;
                      if (tab == 2) {
                          cmp = (x, y) -> Long.compare(sp.getLong("time:" + y.path, 0), sp.getLong("time:" + x.path, 0));
                      } else if (sortMode == 1) {
                          cmp = (x, y) -> Long.compare(y.mod, x.mod);
                      } else if (sortMode == 2) {
                          cmp = (x, y) -> Long.compare(y.size, x.size);
                      } else {
                          cmp = (x, y) -> x.title.compareToIgnoreCase(y.title);
                      }
                      Collections.sort(shown, cmp);
                  }

                  grid.setVisibility(showFolders ? View.GONE : View.VISIBLE);
                  folderList.setVisibility(showFolders ? View.VISIBLE : View.GONE);
                  boolean sortable = tab == 0 || (tab == 1 && currentFolder != null);
                  sortChip.setVisibility(sortable ? View.VISIBLE : View.GONE);
                  String[] sn = {"Name", "Newest", "Largest"};
                  sortChip.setText("Sort: " + sn[sortMode] + " \u25BE");
                  if (tab == 1 && currentFolder != null) {
                      backBar.setVisibility(View.VISIBLE);
                      backBar.setText("\u2039  " + new File(currentFolder).getName());
                  } else {
                      backBar.setVisibility(View.GONE);
                  }

                  int count = showFolders ? folderShown.size() : shown.size();
                  if (scanning) {
                      empty.setText("Scanning for PDFs...");
                      empty.setVisibility(count == 0 ? View.VISIBLE : View.GONE);
                      status.setText("Scanning...");
                  } else {
                      if (tab == 2) empty.setText("No books opened yet.\nYour reading history will appear here.");
                      else empty.setText("No PDFs found.");
                      empty.setVisibility(count == 0 ? View.VISIBLE : View.GONE);
                      status.setText(showFolders ? count + " folders" : count + " PDFs");
                  }
                  bookAdapter.notifyDataSetChanged();
                  folderAdapter.notifyDataSetChanged();
                  updateHero();
              }

              private void updateHero() {
                  heroHolder.removeAllViews();
                  Book last = null;
                  long best = 0;
                  for (Book bk : all) {
                      long t = sp.getLong("time:" + bk.path, 0);
                      if (t > best) { best = t; last = bk; }
                  }
                  if (!(tab == 0 && query.isEmpty() && last != null)) {
                      heroHolder.setVisibility(View.GONE);
                      return;
                  }
                  heroHolder.setVisibility(View.VISIBLE);
                  final Book book = last;
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.HORIZONTAL);
                  card.setGravity(Gravity.CENTER_VERTICAL);
                  card.setPadding(dp(12), dp(12), dp(14), dp(12));
                  card.setBackground(shape(Color.WHITE, 20));
                  card.setElevation(dp(4));
                  card.setOnClickListener(v -> open(book));

                  Cover cover = new Cover(12);
                  cover.bind(book);
                  card.addView(cover.root, new LinearLayout.LayoutParams(dp(72), dp(100)));

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams clp = new LinearLayout.LayoutParams(0, -2, 1);
                  clp.leftMargin = dp(14);
                  TextView k = tv("CONTINUE READING", 10, PINK, true);
                  k.setLetterSpacing(0.1f);
                  col.addView(k);
                  TextView t = tv(book.title, 17, INK, true);
                  t.setMaxLines(2);
                  t.setEllipsize(TextUtils.TruncateAt.END);
                  col.addView(t);
                  TextView f = tv(new File(book.folder).getName(), 12, MUTED, false);
                  f.setSingleLine(true);
                  col.addView(f);

                  int p = pct(book.path);
                  int tot = sp.getInt("tot:" + book.path, 0);
                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  View fill = new View(this);
                  fill.setBackground(shape(PINK, 3));
                  View rest = new View(this);
                  rest.setBackground(shape(0xFFE8EAF3, 3));
                  bar.addView(fill, new LinearLayout.LayoutParams(0, -1, Math.max(p, 1)));
                  bar.addView(rest, new LinearLayout.LayoutParams(0, -1, Math.max(100 - p, 0)));
                  LinearLayout.LayoutParams blp = new LinearLayout.LayoutParams(-1, dp(6));
                  blp.topMargin = dp(10);
                  col.addView(bar, blp);

                  LinearLayout info = new LinearLayout(this);
                  info.setOrientation(LinearLayout.HORIZONTAL);
                  info.setGravity(Gravity.CENTER_VERTICAL);
                  String pg = tot > 0 ? "Page " + (sp.getInt("pos:" + book.path, 0) + 1) + " / " + tot + "  \u2022  " + p + "%" : "";
                  info.addView(tv(pg, 12, MUTED, false), new LinearLayout.LayoutParams(0, -2, 1));
                  info.addView(tv("CONTINUE \u203A", 13, PINK, true));
                  LinearLayout.LayoutParams ilp = new LinearLayout.LayoutParams(-1, -2);
                  ilp.topMargin = dp(8);
                  col.addView(info, ilp);
                  card.addView(col, clp);
                  heroHolder.addView(card, new FrameLayout.LayoutParams(-1, -2));
              }

              @Override
              public void onBackPressed() {
                  if (search.getVisibility() == View.VISIBLE) {
                      search.setText("");
                      search.setVisibility(View.GONE);
                  } else if (tab == 1 && currentFolder != null) {
                      currentFolder = null;
                      refresh();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  pool.shutdownNow();
              }

              // ------------------------------------------------------------------ thumbnails
              private void loadThumb(final Book b, final ImageView iv) {
                  final String key = b.path + "|" + b.mod + "|" + b.size;
                  iv.setTag(key);
                  Bitmap m = mem.get(key);
                  if (m != null) {
                      iv.setImageBitmap(m);
                      return;
                  }
                  try {
                      pool.submit(() -> {
                          if (!key.equals(iv.getTag())) return;
                          Bitmap bmp = null;
                          try {
                              File dir = new File(getCacheDir(), "thumbs");
                              dir.mkdirs();
                              File cf = new File(dir, Integer.toHexString(key.hashCode()) + ".jpg");
                              if (cf.exists()) bmp = BitmapFactory.decodeFile(cf.getAbsolutePath());
                              if (bmp == null) {
                                  bmp = renderFirstPage(b.file, 360);
                                  if (bmp != null) {
                                      FileOutputStream fo = new FileOutputStream(cf);
                                      bmp.compress(Bitmap.CompressFormat.JPEG, 85, fo);
                                      fo.close();
                                  }
                              }
                          } catch (Throwable t) {
                              bmp = null;
                          }
                          if (bmp == null) return;
                          mem.put(key, bmp);
                          final Bitmap fb = bmp;
                          runOnUiThread(() -> {
                              if (key.equals(iv.getTag())) iv.setImageBitmap(fb);
                          });
                      });
                  } catch (Exception ignored) { }
              }

              private Bitmap renderFirstPage(File f, int w) {
                  ParcelFileDescriptor pfd = null;
                  PdfRenderer r = null;
                  PdfRenderer.Page p = null;
                  try {
                      pfd = ParcelFileDescriptor.open(f, ParcelFileDescriptor.MODE_READ_ONLY);
                      r = new PdfRenderer(pfd);
                      p = r.openPage(0);
                      int h = (int) (w * (float) p.getHeight() / p.getWidth());
                      Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                      bmp.eraseColor(Color.WHITE);
                      p.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                      return bmp;
                  } catch (Throwable t) {
                      return null;
                  } finally {
                      try { if (p != null) p.close(); } catch (Throwable ignored) { }
                      try { if (r != null) r.close(); } catch (Throwable ignored) { }
                      try { if (pfd != null) pfd.close(); } catch (Throwable ignored) { }
                  }
              }

              // ------------------------------------------------------------------ views
              private class Cover {
                  final FrameLayout root;
                  final TextView lbl, badge;
                  final ImageView iv;
                  final LinearLayout bar;
                  final View fill, rest;
                  final int corner;

                  Cover(int cornerDp) {
                      corner = cornerDp;
                      root = new FrameLayout(MainActivity.this);
                      root.setOutlineProvider(new ViewOutlineProvider() {
                          @Override
                          public void getOutline(View v, Outline o) {
                              o.setRoundRect(0, 0, v.getWidth(), v.getHeight(), dp(corner));
                          }
                      });
                      root.setClipToOutline(true);
                      lbl = tv("PDF", 16, Color.WHITE, true);
                      lbl.setGravity(Gravity.CENTER);
                      lbl.setAlpha(0.85f);
                      root.addView(lbl, new FrameLayout.LayoutParams(-1, -1));
                      iv = new ImageView(MainActivity.this);
                      iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      root.addView(iv, new FrameLayout.LayoutParams(-1, -1));
                      bar = new LinearLayout(MainActivity.this);
                      bar.setOrientation(LinearLayout.HORIZONTAL);
                      fill = new View(MainActivity.this);
                      fill.setBackgroundColor(PINK);
                      rest = new View(MainActivity.this);
                      rest.setBackgroundColor(0x88FFFFFF);
                      bar.addView(fill, new LinearLayout.LayoutParams(0, -1, 1));
                      bar.addView(rest, new LinearLayout.LayoutParams(0, -1, 1));
                      root.addView(bar, new FrameLayout.LayoutParams(-1, dp(4), Gravity.BOTTOM));
                      badge = tv("", 10, Color.WHITE, true);
                      badge.setBackground(shape(PINK, 8));
                      badge.setPadding(dp(6), dp(2), dp(6), dp(2));
                      FrameLayout.LayoutParams blp = new FrameLayout.LayoutParams(-2, -2, Gravity.TOP | Gravity.END);
                      blp.setMargins(0, dp(6), dp(6), 0);
                      root.addView(badge, blp);
                  }

                  void bind(Book b) {
                      root.setBackgroundColor(PALETTE[Math.abs(b.path.hashCode()) % PALETTE.length]);
                      iv.setImageDrawable(null);
                      loadThumb(b, iv);
                      int tot = sp.getInt("tot:" + b.path, 0);
                      int p = pct(b.path);
                      if (tot > 0) {
                          bar.setVisibility(View.VISIBLE);
                          fill.setLayoutParams(new LinearLayout.LayoutParams(0, -1, Math.max(p, 1)));
                          rest.setLayoutParams(new LinearLayout.LayoutParams(0, -1, Math.max(100 - p, 0)));
                          badge.setVisibility(View.VISIBLE);
                          badge.setText(p + "%");
                      } else {
                          bar.setVisibility(View.GONE);
                          badge.setVisibility(View.GONE);
                      }
                  }
              }

              private class CellHolder {
                  final LinearLayout root;
                  final Cover cover;
                  final TextView title, sub;

                  CellHolder() {
                      root = new LinearLayout(MainActivity.this);
                      root.setOrientation(LinearLayout.VERTICAL);
                      cover = new Cover(12);
                      root.addView(cover.root, new LinearLayout.LayoutParams(-1, (int) (colW * 1.38f)));
                      title = tv("", 12, INK, true);
                      title.setMaxLines(2);
                      title.setEllipsize(TextUtils.TruncateAt.END);
                      LinearLayout.LayoutParams tlp = new LinearLayout.LayoutParams(-1, -2);
                      tlp.topMargin = dp(6);
                      root.addView(title, tlp);
                      sub = tv("", 10, MUTED, false);
                      sub.setSingleLine(true);
                      root.addView(sub);
                  }

                  void bind(Book b) {
                      cover.bind(b);
                      title.setText(b.title);
                      sub.setText(sizeStr(b.size));
                  }
              }

              private class BookAdapter extends BaseAdapter {
                  public int getCount() { return shown.size(); }
                  public Object getItem(int i) { return shown.get(i); }
                  public long getItemId(int i) { return i; }

                  public View getView(int pos, View cv, ViewGroup parent) {
                      CellHolder h;
                      if (cv == null) {
                          h = new CellHolder();
                          cv = h.root;
                          cv.setTag(h);
                      } else {
                          h = (CellHolder) cv.getTag();
                      }
                      h.bind(shown.get(pos));
                      return cv;
                  }
              }

              private class FolderAdapter extends BaseAdapter {
                  public int getCount() { return folderShown.size(); }
                  public Object getItem(int i) { return folderShown.get(i); }
                  public long getItemId(int i) { return i; }

                  public View getView(int pos, View cv, ViewGroup parent) {
                      String path = folderShown.get(pos);
                      List<Book> l = byFolder.get(path);
                      int n = l == null ? 0 : l.size();
                      LinearLayout outer = new LinearLayout(MainActivity.this);
                      outer.setPadding(dp(14), dp(6), dp(14), dp(6));
                      LinearLayout card = new LinearLayout(MainActivity.this);
                      card.setOrientation(LinearLayout.HORIZONTAL);
                      card.setGravity(Gravity.CENTER_VERTICAL);
                      card.setPadding(dp(12), dp(12), dp(14), dp(12));
                      card.setBackground(shape(Color.WHITE, 16));
                      card.setElevation(dp(2));
                      TextView icon = tv("\uD83D\uDCC1", 22, Color.WHITE, false);
                      icon.setGravity(Gravity.CENTER);
                      icon.setBackground(shape(PALETTE[Math.abs(path.hashCode()) % PALETTE.length], 14));
                      card.addView(icon, new LinearLayout.LayoutParams(dp(48), dp(48)));
                      LinearLayout col = new LinearLayout(MainActivity.this);
                      col.setOrientation(LinearLayout.VERTICAL);
                      LinearLayout.LayoutParams clp = new LinearLayout.LayoutParams(0, -2, 1);
                      clp.leftMargin = dp(14);
                      TextView name = tv(new File(path).getName(), 15, INK, true);
                      name.setSingleLine(true);
                      name.setEllipsize(TextUtils.TruncateAt.END);
                      col.addView(name);
                      TextView sub = tv(n + " PDFs  \u2022  " + path, 11, MUTED, false);
                      sub.setSingleLine(true);
                      sub.setEllipsize(TextUtils.TruncateAt.MIDDLE);
                      col.addView(sub);
                      card.addView(col, clp);
                      card.addView(tv("\u203A", 24, MUTED, false));
                      outer.addView(card, new LinearLayout.LayoutParams(-1, -2));
                      return outer;
                  }
              }
          }
