          package com.jahid.pdfreader;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.pdf.PdfDocument;
          import android.media.ExifInterface;
          import android.net.Uri;
          import android.os.Environment;
          import android.text.StaticLayout;
          import android.text.TextPaint;
          import android.util.Xml;

          import org.xmlpull.v1.XmlPullParser;

          import java.io.BufferedInputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          final class PdfTools {
              static class Para {
                  final String text;
                  final boolean heading;

                  Para(String t, boolean h) {
                      text = t;
                      heading = h;
                  }
              }

              static File outDir() {
                  File d = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOCUMENTS), "FM PDF Reader");
                  d.mkdirs();
                  return d;
              }

              static File uniqueFile(String base) {
                  base = base.replaceAll("[\\\\/:*?\"<>|]", "_").trim();
                  if (base.isEmpty()) base = "document";
                  File d = outDir();
                  File f = new File(d, base + ".pdf");
                  int i = 1;
                  while (f.exists()) {
                      f = new File(d, base + "_" + i + ".pdf");
                      i++;
                  }
                  return f;
              }

              // ---------------------------------------------------------------- images -> pdf
              static void imagesToPdf(Context c, List<Uri> uris, File out) throws Exception {
                  PdfDocument doc = new PdfDocument();
                  try {
                      int n = 0;
                      for (Uri u : uris) {
                          Bitmap bmp = decode(c, u, 2200);
                          if (bmp == null) continue;
                          boolean land = bmp.getWidth() > bmp.getHeight();
                          int pw = land ? 842 : 595, ph = land ? 595 : 842;
                          n++;
                          PdfDocument.Page page = doc.startPage(new PdfDocument.PageInfo.Builder(pw, ph, n).create());
                          Canvas cv = page.getCanvas();
                          cv.drawColor(Color.WHITE);
                          float s = Math.min((float) pw / bmp.getWidth(), (float) ph / bmp.getHeight());
                          float w = bmp.getWidth() * s, h = bmp.getHeight() * s;
                          float l = (pw - w) / 2f, t = (ph - h) / 2f;
                          cv.drawBitmap(bmp, null, new RectF(l, t, l + w, t + h), new Paint(Paint.FILTER_BITMAP_FLAG));
                          doc.finishPage(page);
                          bmp.recycle();
                      }
                      if (n == 0) throw new Exception("No readable images");
                      FileOutputStream fo = new FileOutputStream(out);
                      doc.writeTo(fo);
                      fo.close();
                  } finally {
                      doc.close();
                  }
              }

              private static Bitmap decode(Context c, Uri u, int max) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      InputStream in = c.getContentResolver().openInputStream(u);
                      BitmapFactory.decodeStream(in, null, o);
                      in.close();
                      int m = Math.max(o.outWidth, o.outHeight);
                      int s = 1;
                      while (m / (s * 2) >= max) s *= 2;
                      BitmapFactory.Options o2 = new BitmapFactory.Options();
                      o2.inSampleSize = s;
                      in = c.getContentResolver().openInputStream(u);
                      Bitmap b = BitmapFactory.decodeStream(in, null, o2);
                      in.close();
                      if (b == null) return null;
                      int rot = 0;
                      try {
                          in = c.getContentResolver().openInputStream(u);
                          ExifInterface ex = new ExifInterface(in);
                          int or = ex.getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL);
                          in.close();
                          if (or == ExifInterface.ORIENTATION_ROTATE_90) rot = 90;
                          else if (or == ExifInterface.ORIENTATION_ROTATE_180) rot = 180;
                          else if (or == ExifInterface.ORIENTATION_ROTATE_270) rot = 270;
                      } catch (Throwable ignored) { }
                      if (rot != 0) {
                          Matrix mx = new Matrix();
                          mx.postRotate(rot);
                          Bitmap r = Bitmap.createBitmap(b, 0, 0, b.getWidth(), b.getHeight(), mx, true);
                          if (r != b) b.recycle();
                          b = r;
                      }
                      return b;
                  } catch (Throwable t) {
                      return null;
                  }
              }

              // ---------------------------------------------------------------- docx -> paragraphs
              static List<Para> readDocx(Context c, Uri u) throws Exception {
                  InputStream in = c.getContentResolver().openInputStream(u);
                  ZipInputStream zin = new ZipInputStream(new BufferedInputStream(in));
                  try {
                      ZipEntry e;
                      while ((e = zin.getNextEntry()) != null) {
                          if (e.getName().equals("word/document.xml")) return parseDocXml(zin);
                      }
                  } finally {
                      zin.close();
                  }
                  throw new Exception("This is not a valid .docx file (old .doc files are not supported)");
              }

              private static List<Para> parseDocXml(InputStream is) throws Exception {
                  XmlPullParser p = Xml.newPullParser();
                  p.setInput(is, "UTF-8");
                  List<Para> out = new ArrayList<>();
                  StringBuilder sb = null;
                  boolean heading = false;
                  int ev = p.getEventType();
                  while (ev != XmlPullParser.END_DOCUMENT) {
                      if (ev == XmlPullParser.START_TAG) {
                          String n = p.getName();
                          if (n.equals("w:p")) {
                              sb = new StringBuilder();
                              heading = false;
                          } else if (n.equals("w:pStyle")) {
                              String v = p.getAttributeValue(null, "w:val");
                              if (v != null && (v.startsWith("Heading") || v.equals("Title"))) heading = true;
                          } else if (n.equals("w:t") && sb != null) {
                              sb.append(p.nextText());
                          } else if (n.equals("w:tab") && sb != null) {
                              sb.append("    ");
                          } else if ((n.equals("w:br") || n.equals("w:cr")) && sb != null) {
                              sb.append("\n");
                          }
                      } else if (ev == XmlPullParser.END_TAG) {
                          if (p.getName().equals("w:p") && sb != null) {
                              out.add(new Para(sb.toString(), heading));
                              sb = null;
                          }
                      }
                      ev = p.next();
                  }
                  return out;
              }

              // ---------------------------------------------------------------- paragraphs -> pdf
              static void parasToPdf(List<Para> paras, File out) throws Exception {
                  final int PW = 595, PH = 842, M = 48;
                  boolean any = false;
                  for (Para pa : paras) if (!pa.text.trim().isEmpty()) any = true;
                  if (!any) throw new Exception("The document has no text");
                  PdfDocument doc = new PdfDocument();
                  try {
                      TextPaint body = new TextPaint(Paint.ANTI_ALIAS_FLAG);
                      body.setTextSize(12);
                      body.setColor(Color.BLACK);
                      TextPaint head = new TextPaint(body);
                      head.setTextSize(18);
                      head.setFakeBoldText(true);
                      int pageNo = 1;
                      PdfDocument.Page page = doc.startPage(new PdfDocument.PageInfo.Builder(PW, PH, pageNo).create());
                      Canvas cv = page.getCanvas();
                      float y = M;
                      for (Para pa : paras) {
                          TextPaint tp = pa.heading ? head : body;
                          String t = pa.text;
                          if (t.isEmpty()) {
                              y += tp.getTextSize();
                              if (y > PH - M) {
                                  doc.finishPage(page);
                                  pageNo++;
                                  page = doc.startPage(new PdfDocument.PageInfo.Builder(PW, PH, pageNo).create());
                                  cv = page.getCanvas();
                                  y = M;
                              }
                              continue;
                          }
                          StaticLayout lay = StaticLayout.Builder.obtain(t, 0, t.length(), tp, PW - 2 * M)
                                  .setLineSpacing(0f, 1.25f).build();
                          for (int i = 0; i < lay.getLineCount(); i++) {
                              float lh = lay.getLineBottom(i) - lay.getLineTop(i);
                              if (y + lh > PH - M) {
                                  doc.finishPage(page);
                                  pageNo++;
                                  page = doc.startPage(new PdfDocument.PageInfo.Builder(PW, PH, pageNo).create());
                                  cv = page.getCanvas();
                                  y = M;
                              }
                              int ls = lay.getLineStart(i), le = lay.getLineEnd(i);
                              if (le > ls && t.charAt(le - 1) == '\n') le--;
                              cv.drawText(t, ls, le, M, y + (lay.getLineBaseline(i) - lay.getLineTop(i)), tp);
                              y += lh;
                          }
                          y += pa.heading ? 10 : 6;
                      }
                      doc.finishPage(page);
                      FileOutputStream fo = new FileOutputStream(out);
                      doc.writeTo(fo);
                      fo.close();
                  } finally {
                      doc.close();
                  }
              }
          }
