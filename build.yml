          public class SplashActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Ui.ORANGE);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackground(new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{Ui.ORANGE, Ui.PINK}));

                  final LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.CENTER);
                  col.addView(Ui.circlePhoto(this, Color.WHITE, 5),
                          new LinearLayout.LayoutParams(Ui.dp(this, 170), Ui.dp(this, 170)));
                  TextView name = Ui.tv(this, "Forkan Mahmud", 26, Color.WHITE, true);
                  name.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams nlp = new LinearLayout.LayoutParams(-2, -2);
                  nlp.topMargin = Ui.dp(this, 22);
                  col.addView(name, nlp);
                  TextView app = Ui.tv(this, "FM PDF Reader - All in one", 15, 0xEEFFFFFF, false);
                  app.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams alp = new LinearLayout.LayoutParams(-2, -2);
                  alp.topMargin = Ui.dp(this, 6);
                  col.addView(app, alp);
                  root.addView(col, new FrameLayout.LayoutParams(-2, -2, Gravity.CENTER));
                  setContentView(root);

                  col.setAlpha(0f);
                  col.setScaleX(0.85f);
                  col.setScaleY(0.85f);
                  col.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(800).start();

                  root.postDelayed(() -> {
                      if (isFinishing()) return;
                      startActivity(new Intent(SplashActivity.this, MainActivity.class));
                      finish();
                      overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out);
                  }, 2200);
              }
          }
