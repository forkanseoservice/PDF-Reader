              // ------------------------------------------------------------------ delete / options
              private void bookMenu(final Book b) {
                  new AlertDialog.Builder(this)
                          .setTitle(b.title)
                          .setItems(new String[]{"Open", "Delete from phone"}, (d, which) -> {
                              if (which == 0) open(b);
                              else confirmDelete(b);
                          })
                          .show();
              }

              private void confirmDelete(final Book b) {
                  new AlertDialog.Builder(this)
                          .setTitle("Delete PDF?")
                          .setMessage(b.title + "\n\nThis will permanently delete the file from your phone.")
                          .setPositiveButton("Delete", (d, w) -> {
                              if (b.file.delete()) {
                                  removeBook(b);
                                  Toast.makeText(this, "Deleted", Toast.LENGTH_SHORT).show();
                              } else {
                                  Toast.makeText(this, "Could not delete this file", Toast.LENGTH_LONG).show();
                              }
